services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: compasso
      POSTGRES_PASSWORD: compasso
      POSTGRES_DB: compasso
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compasso -d compasso"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
